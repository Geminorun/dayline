packages:
  - apps/*
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  core-js: false
  core-js-pure: false
  prisma: true

overrides:
  webpack: ^5.112.2

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.13'
  - '@better-auth/drizzle-adapter@1.7.13'
  - '@better-auth/kysely-adapter@1.7.13'
  - '@better-auth/memory-adapter@1.7.13'
  - '@better-auth/mongo-adapter@1.7.13'
  - '@better-auth/prisma-adapter@1.7.13'
  - '@better-auth/telemetry@1.7.13'
  - auth@1.7.13
  - better-auth@1.7.13
  - eslint-plugin-vue@10.12.0

# uni-mp-vite requires the CommonJS walker in independentMain.js but omits it
# from its manifest. Declare it so clean installs never depend on hoist order.
packageExtensions:
  '@dcloudio/uni-mp-vite@3.0.0-5030320261023001':
    dependencies:
      estree-walker: 2.0.2
