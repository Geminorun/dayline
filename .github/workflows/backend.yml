name: Dayline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dayline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dayline
          POSTGRES_PASSWORD: dayline_ci_only
          POSTGRES_DB: dayline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayline -d dayline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://dayline:dayline_ci_only@127.0.0.1:5432/dayline_test
      TEST_DATABASE_URL: postgresql://dayline:dayline_ci_only@127.0.0.1:5432/dayline_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check:i18n
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:deployment
      - run: pnpm test:diagnostics
      - run: pnpm test:integration
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@v3
      - name: Select immutable release
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install native Nginx for the isolated CI fixtures
        run: |
          if ! command -v nginx >/dev/null || ! command -v htpasswd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends nginx apache2-utils
          fi
      - name: Verify diagnostic authentication and snapshot publishing
        run: python3 -m unittest discover -s scripts/diagnostics -p 'test_*.py'
      - name: Verify deployment through an existing host Nginx
        env:
          DAYLINE_TEST_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: node scripts/verify-containers.mjs
      - name: Write verified release manifest
        env:
          DAYLINE_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          RELEASE_MANIFEST: ${{ runner.temp }}/dayline-release/release.json
        run: node scripts/deploy/release.mjs write
      - uses: actions/upload-artifact@v4
        with:
          name: dayline-release-${{ github.sha }}
          path: ${{ runner.temp }}/dayline-release/release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
