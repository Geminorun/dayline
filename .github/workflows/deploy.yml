name: Deploy Dayline

on:
  workflow_run:
    workflows: [Dayline checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check the prepared release without contacting the server
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: dayline-production
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      image: ${{ steps.release.outputs.image }}
      revision: ${{ steps.ci.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Find successful CI for this exact commit
        id: ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy/release.mjs select
      - uses: actions/download-artifact@v4
        with:
          name: dayline-release-${{ steps.ci.outputs.revision }}
          path: ${{ runner.temp }}/dayline-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci.outputs.run_id }}
      - name: Validate the prepared release
        id: release
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/dayline-release/release.json
          RELEASE_RUN_ID: ${{ steps.ci.outputs.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ steps.ci.outputs.run_attempt }}
        run: node scripts/deploy/release.mjs read
  deploy:
    if: ${{ !inputs.verify_only }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.revision }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Check whether an automatic release is still current
        id: current
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy/release.mjs current
      - name: Deploy over verified SSH
        if: steps.current.outputs.current == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_ENV: ${{ secrets.APP_ENV }}
          DAYLINE_IMAGE: ${{ needs.release.outputs.image }}
          RELEASE_REVISION: ${{ needs.release.outputs.revision }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy/dispatch.mjs
