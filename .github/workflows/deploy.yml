name: Deploy Dayline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dayline-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/backend.yml
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@v3
      - name: Select immutable release
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify deployment through an existing host Nginx
        env:
          DAYLINE_TEST_IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          DAYLINE_TEST_NGINX_MODE: host
        run: node scripts/verify-containers.mjs
      - name: Verify the optional Nginx container
        env:
          DAYLINE_TEST_IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          DAYLINE_TEST_NGINX_MODE: container
        run: node scripts/verify-containers.mjs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Deploy over verified SSH
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_ENV: ${{ secrets.APP_ENV }}
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
          DAYLINE_IMAGE: ${{ needs.build.outputs.image }}
          RELEASE_REVISION: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy/dispatch.mjs
