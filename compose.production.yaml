# Default deployment: reuse the host Nginx and existing PostgreSQL.
# Add compose.nginx.yaml only for explicit NGINX_MODE=container.
services:
  app:
    image: ${DAYLINE_IMAGE:?Set DAYLINE_IMAGE to the release image digest}
    init: true
    env_file:
      - path: .runtime.env
        format: raw
    ports:
      - '127.0.0.1:${DAYLINE_APP_PORT:-13000}:3000'
    networks:
      - database
    restart: unless-stopped
    stop_grace_period: 75s
networks:
  database:
    external: true
    name: ${DAYLINE_DB_NETWORK:-dayline-database}
