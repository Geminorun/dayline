# Standalone production deployment; PostgreSQL already exists on the server.
services:
  app:
    image: ${DAYLINE_IMAGE:?Set DAYLINE_IMAGE to the release image digest}
    init: true
    env_file:
      - path: .runtime.env
        format: raw
    ports:
      - '127.0.0.1:${DAYLINE_APP_PORT:-13000}:3000'
    networks:
      - database
      - proxy
    restart: unless-stopped
    stop_grace_period: 75s
  gateway:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    ports:
      - '${DAYLINE_NGINX_BIND:-0.0.0.0}:${DAYLINE_HTTP_PORT:-80}:80'
      - '${DAYLINE_NGINX_BIND:-0.0.0.0}:${DAYLINE_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/cloudflare-real-ip.conf:/etc/nginx/dayline/cloudflare-real-ip.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks:
      - proxy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-Y',
          'off',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:8080/health/nginx',
        ]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 15s
networks:
  database:
    external: true
    name: ${DAYLINE_DB_NETWORK:-dayline-database}
  proxy:
    external: true
    name: ${DAYLINE_PROXY_NETWORK:-dayline-proxy}
