services:
  api:
    image: ${DAYLINE_API_IMAGE:-dayline-api:local}
    build:
      context: .
      secrets:
        - proxy_ca
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_USE_ENV_PROXY: 1
      NODE_EXTRA_CA_CERTS: /run/secrets/proxy_ca
      HOST: 0.0.0.0
      DATABASE_URL: ${API_DATABASE_URL:?Set API_DATABASE_URL to the db service URL}
    secrets:
      - proxy_ca
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: caddy:2.10.2-alpine
    entrypoint: ['/bin/sh', '/etc/dayline-entrypoint.sh']
    command:
      [
        'caddy',
        'run',
        '--config',
        '/etc/caddy/Caddyfile',
        '--adapter',
        'caddyfile',
      ]
    environment:
      DAYLINE_HOST: ${DAYLINE_HOST:?Set the public site origin}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./infra/container-entrypoint.sh:/etc/dayline-entrypoint.sh:ro
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/dayline:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
secrets:
  proxy_ca:
    file: ${DAYLINE_BUILD_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
