# Include inside the Dayline HTTPS server block only.
location = /internal/diagnostics {
    if ($scheme != https) { return 404; }
    satisfy all;
    auth_basic "Dayline diagnostics";
    auth_basic_user_file /etc/dayline-diagnostics/htpasswd;
    limit_except GET { deny all; }
    alias /var/lib/dayline-diagnostics/summary.ndjson;
    types { }
    default_type application/x-ndjson;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    expires off;
    etag off;
    if_modified_since off;
    access_log off;
}
